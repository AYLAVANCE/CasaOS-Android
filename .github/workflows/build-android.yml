name: Build CasaOS Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Compile Android ARM64 Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Install ARM64 Cross Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Create output directories
        run: |
          mkdir -p build/sysroot/usr/bin

      - name: Build CasaOS Daemon (ARM64)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build -tags android -ldflags="-s -w" -o build/sysroot/usr/bin/casaos main.go || \
          go build -tags android -buildmode=pie -ldflags="-s -w -extld=aarch64-linux-gnu-gcc" -o build/sysroot/usr/bin/casaos main.go

      - name: Build CasaOS Supervisor (ARM64)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build -tags android -ldflags="-s -w" -o build/sysroot/usr/bin/casaos-supervisor cmd/supervisor/main.go || \
          go build -tags android -buildmode=pie -ldflags="-s -w -extld=aarch64-linux-gnu-gcc" -o build/sysroot/usr/bin/casaos-supervisor cmd/supervisor/main.go

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: casaos-android-arm64
          path: build/sysroot/usr/bin/
